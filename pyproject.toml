[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pm-alpha-bot"
version = "0.1.0"
description = "Paper-first Polymarket wallet-weighted EV trading bot MVP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Codex" }]
dependencies = [
  "alembic>=1.13.2",
  "httpx>=0.27.0",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.3.4",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1",
  "sqlalchemy>=2.0.31",
  "tenacity>=8.5.0",
  "typer>=0.12.3",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "freezegun>=1.5.1",
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "respx>=0.21.1",
  "ruff>=0.5.7",
]
live = [
  "py-clob-client-v2",
]

[project.scripts]
pm-bot = "pm_alpha_bot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_alpha_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
