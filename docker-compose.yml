services:
  postgres:
    image: postgres:16
    container_name: pm-alpha-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pm_alpha_bot
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm_alpha_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
